apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: login-register-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: app1
      http:
        paths:
          - path: "/app1"
            pathType: Prefix
            backend:
              service:
                name: app1
                port:
                  number : 80
    - host: app2
      http:
        paths:
          - path: "/app2"
            pathType: Prefix
            backend:
              service:
                name: app2
                port:
                  number : 80