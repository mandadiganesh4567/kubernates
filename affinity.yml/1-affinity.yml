apiVersion: v1
kind: Pod
metadata:
  name: pod1
  labels:
    purpose: podaffinity
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: purpose
            operator: In
            values:
            - podaffinity
        topologyKey: topology.kubernetes.io/zone
  containers:
  - name: nginx
    image: nginx:1.23.3-alpine