apiVersion: v1
kind: Pod
metadata:
  name: pod2
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: purpose
            operator: In
            values:
            - podaffinity
        topologyKey: kubernetes.io/hostname
  containers:
  - name: nginx
    image: nginx:1.23.3-alpine